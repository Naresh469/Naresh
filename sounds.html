<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sounds — Naresh</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui;background:#000;color:#fff}
.sidebar{position:fixed;left:0;top:0;width:18%;height:100vh;padding:36px 24px;border-right:1px solid rgba(255,255,255,0.06)}
.content{margin-left:18%;padding:48px 6%}
.list{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#070707;padding:18px;border-radius:8px}
.card h4{margin-bottom:8px}
.wave{height:36px;background:linear-gradient(90deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));border-radius:6px;display:flex;align-items:center;padding:6px;gap:6px}
.bar{width:6px;height:18px;background:#fff;opacity:.12;animation:wave 1s linear infinite}
@keyframes wave{0%{transform:scaleY(.6)}50%{transform:scaleY(1.4)}100%{transform:scaleY(.6)}}
.controls{margin-top:8px}
audio{width:100%}
@media(max-width:900px){.list{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sidebar">
  <h1>NARESH<br>BIKRAM RAI</h1>
  <a class="nav-item" href="index.html">Home</a>
  <a class="nav-item" href="map.html">Map</a>
  <a class="nav-item" href="trails.html">Trails</a>
  <a class="nav-item" href="microdocs.html">Micro Docs</a>
  <a class="nav-item" href="photography.html">Photography</a>
  <a class="nav-item" href="sounds.html">Sounds</a>
</div>

<div class="content">
  <h2 style="margin-bottom:18px">Sounds of Eastern Nepal</h2>
  <div class="list">
    <div class="card">
      <h4>Dawn — Maiyung (2:34)</h4>
      <div class="wave" aria-hidden>
        <div class="bar" style="animation-delay:0s"></div>
        <div class="bar" style="animation-delay:.1s"></div>
        <div class="bar" style="animation-delay:.2s"></div>
        <div class="bar" style="animation-delay:.3s"></div>
        <div class="bar" style="animation-delay:.4s"></div>
      </div>
      <div class="controls">
        <audio controls src="assets/sound1.mp3"></audio>
      </div>
      <p style="margin-top:8px;opacity:.8">Recorded at Maiyung Danda early morning. Natural ambience: birds & wind.</p>
    </div>

    <div class="card">
      <h4>Riverbed — Salpa (1:50)</h4>
      <div class="wave" aria-hidden>
        <div class="bar" style="animation-delay:.2s"></div>
        <div class="bar" style="animation-delay:.3s"></div>
        <div class="bar" style="animation-delay:.4s"></div>
        <div class="bar" style="animation-delay:.1s"></div>
      </div>
      <div class="controls">
        <audio controls src="assets/sound2.mp3"></audio>
      </div>
      <p style="margin-top:8px;opacity:.8">Night river ambience near Salpa Pokhari.</p>
    </div>

  </div>
</div>
</body>
</html>
