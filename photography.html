<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Photography — Naresh</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui;background:#000;color:#fff}
.sidebar{position:fixed;left:0;top:0;width:18%;height:100vh;padding:36px 24px;border-right:1px solid rgba(255,255,255,0.06)}
.content{margin-left:18%;padding:48px 6%}
.gallery{column-count:3;column-gap:18px}
.photo{break-inside:avoid;margin-bottom:18px;border-radius:8px;overflow:hidden}
.photo img{width:100%;display:block}
@media(max-width:1000px){.gallery{column-count:2}}
@media(max-width:700px){.gallery{column-count:1}}
.caption{font-size:13px;margin-top:6px;opacity:.8}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px}
.lightbox img{max-width:95%;max-height:90%}
.lightbox .close{position:absolute;top:20px;right:28px;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="sidebar">
  <h1>NARESH<br>BIKRAM RAI</h1>
  <a class="nav-item" href="index.html">Home</a>
  <a class="nav-item" href="map.html">Map</a>
  <a class="nav-item" href="trails.html">Trails</a>
  <a class="nav-item" href="microdocs.html">Micro Docs</a>
  <a class="nav-item" href="photography.html">Photography</a>
  <a class="nav-item" href="sounds.html">Sounds</a>
</div>

<div class="content">
  <h2 style="margin-bottom:18px">Photography Archive</h2>
  <div class="gallery">
    <div class="photo"><img src="assets/photo1.jpg" alt=""><div class="caption">Maiyung Danda — Dawn</div></div>
    <div class="photo"><img src="assets/photo2.jpg" alt=""><div class="caption">Salpa Pokhari — Mist</div></div>
    <div class="photo"><img src="assets/photo3.jpg" alt=""><div class="caption">Rhododendron Close-up</div></div>
    <!-- Add more photos -->
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="close" id="close">✕</div>
  <img id="lightbox-img" src="">
</div>

<script>
document.querySelectorAll('.gallery img').forEach(img=>{
  img.addEventListener('click',e=>{
    document.getElementById('lightbox-img').src = e.target.src;
    document.getElementById('lightbox').style.display = 'flex';
  });
});
document.getElementById('close').addEventListener('click',()=> document.getElementById('lightbox').style.display='none');
document.getElementById('lightbox').addEventListener('click',(e)=>{ if(e.target.id==='lightbox') document.getElementById('lightbox').style.display='none' })
</script>
</body>
</html>
